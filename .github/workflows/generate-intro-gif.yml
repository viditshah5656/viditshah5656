name: Generate profile intro animation

on:
  push:
    paths-ignore:
      - "intro-profile.gif"

permissions:
  contents: write

jobs:
  generate-intro-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate high-quality cinematic GIF
        run: |
          ffmpeg -y -i intro.mp4 \
            -vf "fps=10,scale=800:450:flags=lanczos,format=rgb24,palettegen=max_colors=128:stats_mode=full" \
            /tmp/palette.png

          ffmpeg -y -i intro.mp4 -i /tmp/palette.png \
            -lavfi "fps=10,scale=800:450:flags=lanczos [x]; [x][1:v] paletteuse=dither=sierra2_4a:diff_mode=rectangle" \
            -loop 0 intro-profile.gif

      - name: Replace generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intro-profile.gif
          if git diff --cached --quiet -- intro-profile.gif; then
            echo "No GIF changes to commit."
            exit 0
          fi
          git commit -m "Upgrade profile intro animation quality"
          git push
